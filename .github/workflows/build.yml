name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply update.zip (if present)
        run: |
          if [ -f update.zip ]; then unzip -o update.zip; echo "update.zip applied"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install
      - run: npx cap add android
      - name: Patch Android project (camera permission)
        run: |
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' android/app/src/main/AndroidManifest.xml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set app icon
        run: |
          pip install pillow
          python3 - <<'EOF'
          from PIL import Image, ImageDraw
          src = Image.open('icon.png').convert('RGB')
          m = int(src.width * 0.048)
          crop = src.crop((m, m, src.width - m, src.height - m))
          res = 'android/app/src/main/res'
          for d, k in {'mdpi': 1, 'hdpi': 1.5, 'xhdpi': 2, 'xxhdpi': 3, 'xxxhdpi': 4}.items():
              p = res + '/mipmap-' + d + '/'
              c = int(108 * k); t = int(62 * k)
              fg = Image.new('RGB', (c, c), (0, 0, 0))
              fg.paste(crop.resize((t, t), Image.LANCZOS), ((c - t) // 2, (c - t) // 2))
              fg.save(p + 'ic_launcher_foreground.png')
              s = int(48 * k)
              sq = crop.resize((s, s), Image.LANCZOS).convert('RGBA')
              mk = Image.new('L', (s, s), 0)
              ImageDraw.Draw(mk).rounded_rectangle((0, 0, s - 1, s - 1), radius=int(s * 0.22), fill=255)
              sq.putalpha(mk)
              sq.save(p + 'ic_launcher.png')
              inner = crop.resize((int(s * 0.8), int(s * 0.8)), Image.LANCZOS)
              rd = Image.new('RGBA', (s, s), (0, 0, 0, 255))
              rd.paste(inner, ((s - inner.width) // 2, (s - inner.height) // 2))
              mk2 = Image.new('L', (s, s), 0)
              ImageDraw.Draw(mk2).ellipse((0, 0, s - 1, s - 1), fill=255)
              rd.putalpha(mk2)
              rd.save(p + 'ic_launcher_round.png')
          open(res + '/values/ic_launcher_background.xml', 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#000000</color>\n</resources>\n')
          EOF
      - name: Version number and signing
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          if [ -f almari.keystore ] && [ -n "$KS_PASS" ]; then
            cat >> android/app/build.gradle <<'EOF'

          android {
              lint {
                  checkReleaseBuilds false
              }
              signingConfigs {
                  release {
                      storeFile file("$rootDir/../almari.keystore")
                      storePassword System.getenv("KS_PASS")
                      keyAlias "almari"
                      keyPassword System.getenv("KS_PASS")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "No signing key found: building a test-signed APK that cannot update an older install."
          fi
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          if [ "$SIGNED" = "1" ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../Almari.apk
          else
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../Almari.apk
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: almari-apk
          path: Almari.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Almari build ${{ github.run_number }}
          files: Almari.apk
