<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark"><title>Almari</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#16202b;--mute:#6b7785;--ac:#2f45c5;--ac2:#fff;--ln:#dbe1e8;--top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px),20px);--bot:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px),10px)}
@media(prefers-color-scheme:dark){:root{--bg:#10151b;--card:#19212a;--ink:#e8edf2;--mute:#8f9ba8;--ac:#8fa2ff;--ac2:#10151b;--ln:#2a343f}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,sans-serif;display:flex;flex-direction:column;padding-top:var(--top)}
header{display:flex;justify-content:space-between;align-items:center;padding:8px 16px}header b{font-size:22px;letter-spacing:-.5px}
#main{flex:1;min-height:0}.v{height:100%;overflow:auto;padding:4px 16px 16px}
nav{display:flex;border-top:1px solid var(--ln);background:var(--card);padding-bottom:var(--bot)}
nav button{flex:1;padding:14px 0;border:0;background:none;color:var(--mute);font:inherit;font-weight:600}
nav button.on{color:var(--ac);box-shadow:inset 0 3px var(--ac)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:8px 0}
.mu{color:var(--mute);font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.b{border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px}
.b.p{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
input,textarea{width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;margin:4px 0 10px}
label{display:block;font-size:13px;color:var(--mute)}
.ask{display:flex;flex-direction:column;height:100%}.log{flex:1;overflow:auto;padding:4px 16px}
.m{max-width:88%;padding:10px 12px;border-radius:14px;margin:8px 0;background:var(--bg);border:1px solid var(--ln)}
.m.w{max-width:100%}.m.u{margin-left:auto;background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.send{display:flex;gap:8px;padding:8px 16px}.send input{margin:0}
#lk{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;justify-content:center;padding:32px;padding-top:var(--top)}
#lk h1{margin:0 0 8px}#em{color:#c0392b;min-height:1.4em}
.ov{position:fixed;inset:0;z-index:5;background:#0007;display:flex;align-items:flex-end}
.sh{background:var(--bg);width:100%;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(var(--bot) + 16px)}
.sh h2{margin:0 0 8px;font-size:18px;word-break:break-word}
.pv{max-width:100%;max-height:50vh;display:block;margin:8px auto;overflow:auto;white-space:pre-wrap;font-size:13px}
#tt{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:14px;z-index:20}
.mono{font-family:ui-monospace,monospace}
</style></head><body>
<header><b>Almari</b><button class="b" id="lb">Lock</button></header>
<div id="main"></div>
<nav><button data-t="ask">Ask</button><button data-t="docs">Documents</button><button data-t="vault">Vault</button></nav>
<input type="file" id="fi" multiple hidden><input type="file" id="fc" accept="image/*" capture="environment" hidden>
<div id="lk"><h1 id="lh"></h1><p class="mu" id="lp"></p><input id="pw" type="password" placeholder="Master password" autocomplete="off"><input id="pw2" type="password" placeholder="Repeat master password" autocomplete="off"><button class="b p" id="ub"></button><p id="em"></p></div>
<script src="app.js"></script></body></html>
