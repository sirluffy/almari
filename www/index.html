<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light"><title>Almari</title>
<script>document.documentElement.dataset.t=localStorage.th||'dark'</script>
<style>
@font-face{font-family:'Space Mono';font-weight:400;font-display:swap;src:url(fonts/space-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Space Mono';font-weight:700;font-display:swap;src:url(fonts/space-mono-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:500;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Inter;font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format('woff2')}
:root,:root[data-t=dark]{--bg:#050a08;--surface:rgba(16,30,24,.76);--surface-s:rgba(13,24,20,.94);--surface-h:rgba(28,54,42,.82);--field:rgba(255,255,255,.045);--ac:#20d98b;--ac2:#43f2a5;--acd:#087a4c;--on-ac:#03130c;--tx:#f2f7f4;--mu:#a2b4aa;--sb:#71847a;--bd:rgba(190,230,208,.13);--bda:rgba(48,229,147,.48);--dg:#ff6470;--aur1:rgba(0,190,112,.16);--aur2:rgba(0,130,78,.13);--sh:0 12px 36px rgba(0,0,0,.22);--blur:blur(18px);--fd:'Space Mono',ui-monospace,monospace;--fb:Inter,system-ui,sans-serif;--top:max(env(safe-area-inset-top,0px),var(--safe-area-inset-top,0px),20px);--bot:max(env(safe-area-inset-bottom,0px),var(--safe-area-inset-bottom,0px),10px)}
:root[data-t=light]{--bg:#eef6f1;--surface:rgba(255,255,255,.78);--surface-s:rgba(255,255,255,.96);--surface-h:rgba(214,238,225,.92);--field:rgba(255,255,255,.8);--ac:#0b8a55;--ac2:#0e9f63;--acd:#076b42;--on-ac:#fff;--tx:#0f1f18;--mu:#476055;--sb:#617a6e;--bd:rgba(8,70,45,.15);--bda:rgba(11,138,85,.5);--dg:#c62f3d;--aur1:rgba(0,190,112,.2);--aur2:rgba(0,150,90,.14);--sh:0 10px 28px rgba(20,60,40,.12)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0}
body{color:var(--tx);font:15px/1.5 var(--fb);background:radial-gradient(ellipse at 12% 8%,var(--aur1),transparent 40%),radial-gradient(ellipse at 92% 78%,var(--aur2),transparent 42%),var(--bg);background-attachment:fixed;display:flex;flex-direction:column;padding-top:var(--top);overflow:hidden}
h1,h2,h3,p{margin:0}.pt{font:700 24px/1.2 var(--fd);margin:4px 0 12px}h2{font:700 17px/1.3 var(--fd);margin-bottom:10px}.mu{color:var(--mu)}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 16px}header div{display:flex;gap:8px}
.brand{display:flex;align-items:center;gap:10px;font:700 22px var(--fd);letter-spacing:-.5px}.brand i{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--ac2),var(--ac) 55%,var(--acd));box-shadow:0 0 14px rgba(32,217,139,.45)}
.b,.ico{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:16px;border:1px solid var(--bd);background:var(--surface);color:var(--tx);font:500 14px var(--fb);cursor:pointer;transition:background .18s,border-color .18s,box-shadow .18s,transform .18s;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.b:hover,.ico:hover{background:var(--surface-h);border-color:var(--bda)}.b:active,.ico:active{transform:scale(.97)}.b:disabled,.ico:disabled{opacity:.4;pointer-events:none}
.p{background:linear-gradient(135deg,var(--ac2),var(--ac) 45%,var(--acd));border-color:transparent;color:var(--on-ac);font-weight:600;box-shadow:0 6px 20px rgba(32,217,139,.28)}.p:hover{background:linear-gradient(135deg,var(--ac2),var(--ac) 45%,var(--acd));box-shadow:0 8px 26px rgba(32,217,139,.45)}
.ico{width:44px;padding:0;border-radius:14px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.row:empty{display:none}
input,textarea{width:100%;min-height:48px;padding:12px 16px;margin:4px 0 12px;border-radius:16px;border:1px solid var(--bd);background:var(--field);color:var(--tx);font:400 16px var(--fb)}
input::placeholder,textarea::placeholder{color:var(--sb)}input:focus-visible,textarea:focus-visible{outline:0;border-color:var(--bda);box-shadow:0 0 0 3px rgba(32,217,139,.2)}
label{display:block;font-size:13px;color:var(--mu)}.err{color:var(--dg);font-size:13px;min-height:20px;margin:0 0 8px}.err:not(:empty)::before{content:"! ";font-weight:700}
.pwf{position:relative}.pwf input{padding-right:52px}.pwf .ico{position:absolute;right:2px;top:6px;border:0;background:none;box-shadow:none;color:var(--mu)}
.card,.sh,.m{background:var(--surface);border:1px solid var(--bd);box-shadow:var(--sh);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}.card{border-radius:20px;padding:14px;margin:10px 0}
.item{display:flex;gap:12px;align-items:center;text-align:left}button.item{width:100%;font:inherit;color:inherit;cursor:pointer;transition:border-color .18s,transform .18s}button.item:hover{border-color:var(--bda)}
.ficon{flex:0 0 44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(32,217,139,.1);color:var(--ac2);border:1px solid var(--bd)}
.imain{display:flex;flex-direction:column;min-width:0;flex:1;gap:2px}.nm{font-weight:500;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta,.tg,.rd,.gt,.sec{font-family:var(--fd)}.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sb)}.meta span:first-child{color:var(--ac2)}.tg{font-size:12px;color:var(--mu)}
.sec{font-size:14px;margin-top:10px;word-break:break-all}.gt{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--sb);margin:12px 0 0}.note{font-size:12px;color:var(--sb);margin-top:10px}
.sf{position:relative;margin:4px 0}.sf svg{position:absolute;left:16px;top:15px;color:var(--sb);pointer-events:none}.sf input{padding-left:46px;margin:0;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:0 12px}
.emp{grid-column:1/-1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:40px 12px}.emp .ficon{width:64px;height:64px;border-radius:20px;margin-bottom:6px}.emp b{font:700 17px var(--fd)}.emp .b{margin-top:14px}
.v,.ask{max-width:880px;margin-inline:auto;width:100%}.v{height:100%;overflow:auto;padding:4px 16px 24px}#main{flex:1;min-height:0}
.ask{display:flex;flex-direction:column;height:100%}.log{flex:1;overflow:auto;padding:4px 16px}.welcome{display:flex;flex-direction:column;gap:4px;margin:4px 0 8px}.ttl{font:700 17px var(--fd)}
.m{max-width:92%;padding:12px 14px;border-radius:20px;margin:10px 0}.m.w{max-width:100%}.m.u{margin-left:auto;background:var(--ac);color:var(--on-ac);border:0;font-weight:500}
.send{display:flex;gap:8px;padding:8px 16px;align-items:flex-end}.send textarea{margin:0;border-radius:24px;resize:none;max-height:120px;min-height:48px}.sendbtn{flex:0 0 48px;width:48px;height:48px;border-radius:50%}
nav{display:flex;gap:6px;margin:6px 12px calc(var(--bot) + 4px);padding:6px;border-radius:24px;background:var(--surface-s);border:1px solid var(--bd);box-shadow:var(--sh);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
nav button{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;border-radius:18px;background:none;color:var(--mu);font:700 11px var(--fd);cursor:pointer;transition:background .18s,color .18s}
nav button:hover{background:var(--surface-h)}nav button[aria-current=page]{color:var(--ac2);background:rgba(32,217,139,.12);box-shadow:inset 0 0 0 1px var(--bda)}
#lk{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:24px;padding-top:var(--top);background:radial-gradient(ellipse at 20% 15%,var(--aur1),transparent 50%),radial-gradient(ellipse at 85% 85%,var(--aur2),transparent 50%),var(--bg)}
.lw{width:100%;max-width:440px}.lw h1{font:700 28px/1.2 var(--fd);margin-bottom:8px}.lw .mu{margin-bottom:20px}.lw .pwf input{margin:0 0 12px}.orb{width:56px;height:56px;border-radius:50%;margin-bottom:20px;background:radial-gradient(circle at 35% 30%,var(--ac2),var(--ac) 50%,var(--acd));box-shadow:0 0 36px rgba(32,217,139,.5)}.lw #ub{width:100%}
.ov{position:fixed;inset:0;z-index:5;background:rgba(2,8,5,.6);display:flex;align-items:flex-end;justify-content:center;animation:fi .18s}
.sh{background:var(--surface-s);border-bottom:0;width:100%;max-width:560px;max-height:88%;overflow:auto;border-radius:26px 26px 0 0;padding:20px 16px calc(var(--bot) + 16px);animation:up .2s}
#tt{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--surface-s);color:var(--tx);border:1px solid var(--bda);padding:10px 16px;border-radius:999px;font-size:14px;z-index:20;box-shadow:var(--sh)}
#vw{position:fixed;inset:0;z-index:7;display:flex;flex-direction:column;background:var(--bg);padding-top:var(--top)}
.vh{display:flex;align-items:center;gap:6px;padding:6px 10px}.vh .nm{flex:1;min-width:0;font:700 14px var(--fd);-webkit-line-clamp:1}
.vb{flex:1;overflow:auto;position:relative;padding:8px 8px calc(var(--bot) + 8px);background:rgba(0,0,0,.28)}.vb.pdf{touch-action:pan-x pan-y;padding-bottom:8px}.vb img{display:block;margin:0 auto;max-width:none;border-radius:12px}.vb>.mu{padding:24px;text-align:center}
.vp{min-width:100%;width:max-content}.vb canvas{display:block;margin:0 auto 8px;background:#fff;border-radius:6px;box-shadow:var(--sh)}.vb canvas.ld{background:linear-gradient(90deg,#fff,#e3f5ec,#fff);background-size:200% 100%;animation:ld 1.2s linear infinite}
.vb pre{white-space:pre-wrap;word-break:break-word;font:400 13px var(--fd)}
.vc{display:flex;gap:4px 12px;flex-wrap:wrap;align-items:center;justify-content:center;padding:6px 8px calc(var(--bot) + 4px);background:var(--surface-s);border-top:1px solid var(--bd)}.grp{display:flex;align-items:center;gap:4px}.rd{min-width:34px;text-align:center;font-size:13px;color:var(--mu)}
.pn{width:56px;min-height:44px;margin:0;padding:6px;text-align:center;font:400 14px var(--fd)}.fx{display:none;position:absolute;top:calc(var(--top) + 8px);right:12px;z-index:3}#vw.fs .fx{display:inline-flex}#vw.fs .vh,#vw.fs .vc{display:none}
@media(min-width:768px){.ov{align-items:center}.sh{border-radius:24px}}
@media(hover:hover){button.item:hover{transform:translateY(-2px)}}
@media(min-width:1024px){body{display:grid;grid-template-columns:232px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);padding-top:0}header{grid-column:2;padding:var(--top) 16px 6px;width:100%;max-width:880px;justify-self:center}#main{grid-column:2}
nav{grid-column:1;grid-row:1/3;flex-direction:column;margin:calc(var(--top) + 8px) 8px 16px 16px;padding:10px;height:max-content}nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;padding:0 16px;min-height:48px;font-size:13px}}
@keyframes ld{to{background-position:-200% 0}}@keyframes fi{from{opacity:0}}@keyframes up{from{transform:translateY(24px);opacity:.6}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<header><div class="brand"><i aria-hidden="true"></i>Almari</div><div><button class="ico" id="tb" type="button" aria-label="Switch theme" title="Switch theme"></button><button class="ico" id="lb" type="button" aria-label="Lock Almari" title="Lock Almari"></button></div></header>
<main id="main"></main>
<nav aria-label="Main"><button data-t="docs">Documents</button><button data-t="ask">Ask</button><button data-t="vault">Vault</button></nav>
<input type="file" id="fi" multiple hidden><input type="file" id="fc" accept="image/*" capture="environment" hidden>
<div id="lk"><div class="lw"><div class="orb" aria-hidden="true"></div><h1 id="lh"></h1><p class="mu" id="lp"></p>
<div class="pwf"><input id="pw" type="password" placeholder="Master password" aria-label="Master password" aria-describedby="em" autocomplete="off"><button class="ico" id="pe" type="button" aria-label="Show password"></button></div>
<div id="g2"><input id="pw2" type="password" placeholder="Repeat master password" aria-label="Repeat master password" aria-describedby="em" autocomplete="off"></div>
<p class="err" id="em" role="alert"></p><button class="b p" id="ub" type="button"></button></div></div>
<script src="app.js"></script></body></html>
